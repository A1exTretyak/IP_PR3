<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шапка сайта на CSS Grid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo"></div>
        
        <form class="search">
            <input class="search__input" type="text" placeholder="Поиск">
            <button class="search__button" type="submit">Найти</button>
        </form>
        
        <div class="options">
            <button class="options__button">1</button>
            <button class="options__button">2</button>
            <button class="options__button">3</button>
            <button class="options__button">4</button>
        </div>
        
        <div class="login"></div>
    </header>
</body>
</html>
